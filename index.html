<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kamabaka Crew Bank</title>

<style>
body{
font-family: Arial;
background:#0f172a;
color:white;
margin:40px;
}

.container{max-width:1100px;margin:auto;}

.card{
background:#1e293b;
padding:20px;
margin-bottom:20px;
border-radius:10px;
}

input,button{
padding:10px;
margin:5px;
border-radius:6px;
border:none;
}

button{background:#38bdf8;cursor:pointer;}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #334155;
}

.flex{display:flex;gap:20px;}
.half{flex:1;}

.metric{
font-size:40px;
text-align:center;
font-weight:bold;
}

.progressbar{
background:#334155;
height:20px;
border-radius:10px;
overflow:hidden;
}

.progress{
background:#22c55e;
height:100%;
width:0%;
}
</style>
</head>

<body>

<div class="container">

<h1>🏴‍☠️ Kamabaka Crew Bank</h1>

<div class="card">
<h3>Captain Login</h3>
<input type="password" id="pass" placeholder="Captain password">
<button onclick="login()">Login</button>
<p id="status">Not logged in</p>
</div>

<div class="card">
<h3>Goal</h3>
<input id="goalName" placeholder="Goal name">
<input id="goalAmount" type="number" placeholder="Goal amount">
<button onclick="setGoal()">Set Goal</button>

<p id="goalText"></p>

<div class="progressbar">
<div class="progress" id="progress"></div>
</div>
</div>

<div class="card">
<h3>Add Contribution</h3>
<input id="name" placeholder="Name">
<input id="amount" type="number" placeholder="Amount">
<button onclick="addContribution()">Submit</button>
</div>

<div class="flex">

<div class="card half">
<h2>Total Bank</h2>
<div class="metric" id="total">0</div>
</div>

<div class="card half">
<h2>Leaderboard</h2>
<table>
<thead>
<tr><th>Name</th><th>Total</th></tr>
</thead>
<tbody id="board"></tbody>
</table>
</div>

</div>

<div class="card">
<h3>History</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Amount</th>
<th>Status</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>
<tbody id="history"></tbody>
</table>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, setDoc } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAkKD8yTdyhExoccE_p9slB2enZ-AW23-Y",
  authDomain: "kamabaka-bank.firebaseapp.com",
  projectId: "kamabaka-bank",
  storageBucket: "kamabaka-bank.firebasestorage.app",
  messagingSenderId: "880622846664",
  appId: "1:880622846664:web:f8da8e3571a29ce2ccdbfd",
  measurementId: "G-G91DJ0GKGT"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let captain = false;
let total = 0;
let goal = 0;

// CAPTAIN LOGIN
window.login = function(){
const pass = document.getElementById("pass").value;
if(pass === "Fgabriel"){
captain = true;
document.getElementById("status").innerText = "Captain logged in";
}else{
alert("Wrong password");
}
}

// ADD CONTRIBUTION
window.addContribution = async function(){
let name = document.getElementById("name").value;
let amount = Number(document.getElementById("amount").value);

if(!name || !amount) return;

await addDoc(collection(db,"contributions"),{
name,
amount,
status:"pending",
date:new Date().toLocaleString()
});
}

// SET GOAL
window.setGoal = async function(){
if(!captain) return alert("Captain only");

await setDoc(doc(db,"settings","goal"),{
name:document.getElementById("goalName").value,
amount:Number(document.getElementById("goalAmount").value)
});
}

// CONTRIBUTIONS REALTIME
onSnapshot(collection(db,"contributions"),(snap)=>{

let history = document.getElementById("history");
let board = {};
history.innerHTML="";
total = 0;

snap.forEach(d=>{
let data = d.data();

let actions="";

if(captain && data.status==="pending"){
actions=`
<button onclick="confirm('${d.id}')">Confirm</button>
<button onclick="cancel('${d.id}')">Cancel</button>
`;
}

if(data.status==="confirmed"){
total += data.amount;
board[data.name]=(board[data.name]||0)+data.amount;
}

history.innerHTML += `
<tr>
<td>${data.name}</td>
<td>${data.amount}</td>
<td>${data.status}</td>
<td>${data.date}</td>
<td>${actions}</td>
</tr>`;
});

document.getElementById("total").innerText = total;

let b=document.getElementById("board");
b.innerHTML="";

Object.entries(board)
.sort((a,b)=>b[1]-a[1])
.forEach(p=>{
b.innerHTML += `<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`;
});

updateProgress();
});

// GOAL REALTIME
onSnapshot(doc(db,"settings","goal"),(snap)=>{
let data = snap.data();
if(!data) return;

goal = data.amount;

document.getElementById("goalText").innerText =
data.name + " ("+data.amount+")";

updateProgress();
});

function updateProgress(){
if(!goal) return;
let percent = Math.min((total/goal)*100,100);
document.getElementById("progress").style.width = percent+"%";
}

// CONFIRM / CANCEL
window.confirm = async function(id){
await updateDoc(doc(db,"contributions",id),{status:"confirmed"});
}

window.cancel = async function(id){
await updateDoc(doc(db,"contributions",id),{status:"cancelled"});
}

</script>

</body>
</html>
